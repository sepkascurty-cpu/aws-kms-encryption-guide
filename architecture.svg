<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="880" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="34" font-size="22" font-weight="bold" fill="#232F3E" text-anchor="middle">AWS KMS — Envelope Encryption Architecture</text>
  <text x="600" y="58" font-size="13" fill="#666666" text-anchor="middle">User &#8594; Route 53 &#8594; CloudFront / WAF &#8594; Load Balancer &#8594; App Tier &#8594; KMS-Encrypted Data Stores</text>

  <!-- User -->
  <g>
    <rect x="40" y="90" width="90" height="70" rx="6" fill="#F2F3F3" stroke="#232F3E" stroke-width="1.5"/>
    <circle cx="85" cy="116" r="12" fill="#FF9900"/>
    <path d="M70 152 q15 -18 30 0" stroke="#FF9900" stroke-width="5" fill="none"/>
    <text x="85" y="178" font-size="12" font-weight="bold" fill="#232F3E" text-anchor="middle">User</text>
  </g>

  <!-- AWS Cloud outer box -->
  <rect x="170" y="80" width="1000" height="770" fill="none" stroke="#232F3E" stroke-width="2"/>
  <text x="190" y="106" font-size="16" font-weight="bold" fill="#232F3E">AWS Cloud</text>

  <!-- Route 53 -->
  <g>
    <rect x="210" y="130" width="90" height="64" rx="4" fill="#8C4FFF"/>
    <text x="255" y="156" font-size="26" fill="#ffffff" text-anchor="middle">53</text>
    <text x="255" y="176" font-size="10" fill="#ffffff" text-anchor="middle">Route 53</text>
    <text x="255" y="212" font-size="11" fill="#232F3E" text-anchor="middle">Amazon Route 53</text>
    <text x="255" y="227" font-size="11" font-style="italic" fill="#555" text-anchor="middle">DNS service</text>
  </g>

  <!-- CloudFront -->
  <g>
    <rect x="360" y="130" width="90" height="64" rx="4" fill="#8C4FFF"/>
    <circle cx="405" cy="162" r="16" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="405" cy="162" r="6" fill="#ffffff"/>
    <text x="405" y="212" font-size="11" fill="#232F3E" text-anchor="middle">Amazon CloudFront</text>
    <text x="405" y="227" font-size="11" font-style="italic" fill="#555" text-anchor="middle">CDN</text>
  </g>

  <!-- WAF -->
  <g>
    <rect x="510" y="130" width="90" height="64" rx="4" fill="#D13239"/>
    <text x="555" y="168" font-size="22" fill="#ffffff" text-anchor="middle">&#128737;</text>
    <text x="555" y="212" font-size="11" fill="#232F3E" text-anchor="middle">AWS WAF</text>
    <text x="555" y="227" font-size="11" font-style="italic" fill="#555" text-anchor="middle">Web Application Firewall</text>
  </g>

  <!-- Shield -->
  <g>
    <rect x="660" y="130" width="90" height="64" rx="4" fill="#D13239"/>
    <text x="705" y="168" font-size="22" fill="#ffffff" text-anchor="middle">&#128737;</text>
    <text x="705" y="212" font-size="11" fill="#232F3E" text-anchor="middle">AWS Shield</text>
    <text x="705" y="227" font-size="11" font-style="italic" fill="#555" text-anchor="middle">DDoS protection</text>
  </g>

  <!-- KMS key box (right top) -->
  <g>
    <rect x="830" y="120" width="300" height="110" rx="6" fill="#FFF3F3" stroke="#D13239" stroke-width="2"/>
    <rect x="850" y="136" width="56" height="56" rx="4" fill="#D13239"/>
    <text x="878" y="170" font-size="24" fill="#ffffff" text-anchor="middle">&#128273;</text>
    <text x="920" y="156" font-size="14" font-weight="bold" fill="#232F3E">AWS KMS</text>
    <text x="920" y="174" font-size="11" fill="#555">Customer Managed Key (CMK)</text>
    <text x="920" y="190" font-size="11" fill="#555">AES-256 &#8226; auto-rotation on</text>
    <text x="980" y="216" font-size="11" font-style="italic" fill="#D13239" text-anchor="middle">Plaintext keys NEVER leave KMS</text>
  </g>

  <!-- Arrows top row -->
  <g stroke="#232F3E" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="130" y1="125" x2="210" y2="150"/>
    <line x1="300" y1="162" x2="360" y2="162"/>
    <line x1="450" y1="162" x2="510" y2="162"/>
    <line x1="600" y1="162" x2="660" y2="162"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#232F3E"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#D13239"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#527FFF"/>
    </marker>
  </defs>

  <!-- VPC -->
  <rect x="190" y="260" width="960" height="570" fill="none" stroke="#1B7A2E" stroke-width="2"/>
  <text x="210" y="286" font-size="15" font-weight="bold" fill="#1B7A2E">VPC  (10.0.0.0/16)</text>

  <!-- AZ 1 -->
  <rect x="210" y="300" width="440" height="510" fill="#F7FBFF" stroke="#527FFF" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="430" y="324" font-size="13" font-weight="bold" fill="#527FFF" text-anchor="middle">Availability Zone 1</text>

  <!-- AZ 2 -->
  <rect x="690" y="300" width="440" height="510" fill="#F7FBFF" stroke="#527FFF" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="910" y="324" font-size="13" font-weight="bold" fill="#527FFF" text-anchor="middle">Availability Zone 2</text>

  <!-- ALB spanning AZs -->
  <g>
    <rect x="520" y="350" width="160" height="52" rx="4" fill="#8C4FFF"/>
    <text x="600" y="372" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Elastic Load Balancing</text>
    <text x="600" y="390" font-size="11" fill="#ffffff" text-anchor="middle">Application Load Balancer</text>
  </g>

  <!-- Public subnet AZ1 -->
  <g>
    <rect x="230" y="430" width="400" height="46" fill="#E6F4EA" stroke="#1B7A2E" stroke-width="1"/>
    <text x="240" y="459" font-size="12" font-weight="bold" fill="#1B7A2E">Public subnet</text>
    <text x="620" y="459" font-size="11" fill="#555" text-anchor="end">NAT Gateway</text>
  </g>
  <!-- Web subnet AZ1 -->
  <g>
    <rect x="230" y="490" width="400" height="100" fill="#FFF4E5" stroke="#FF9900" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="240" y="514" font-size="12" font-weight="bold" fill="#B25E00">Web Subnet</text>
    <rect x="280" y="528" width="60" height="44" rx="3" fill="#FF9900"/>
    <text x="310" y="554" font-size="10" fill="#fff" text-anchor="middle">EC2</text>
    <rect x="360" y="528" width="60" height="44" rx="3" fill="#FF9900"/>
    <text x="390" y="554" font-size="10" fill="#fff" text-anchor="middle">EC2</text>
    <text x="500" y="554" font-size="11" fill="#232F3E" text-anchor="middle">EC2 Instances — Web servers</text>
  </g>
  <!-- App subnet AZ1 -->
  <g>
    <rect x="230" y="604" width="400" height="100" fill="#FFF4E5" stroke="#FF9900" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="240" y="628" font-size="12" font-weight="bold" fill="#B25E00">App Subnet</text>
    <rect x="280" y="642" width="60" height="44" rx="3" fill="#FF9900"/>
    <text x="310" y="668" font-size="10" fill="#fff" text-anchor="middle">EC2</text>
    <rect x="360" y="642" width="60" height="44" rx="3" fill="#FF9900"/>
    <text x="390" y="668" font-size="10" fill="#fff" text-anchor="middle">EC2</text>
    <text x="500" y="668" font-size="11" fill="#232F3E" text-anchor="middle">EC2 Instances — App servers</text>
    <text x="500" y="684" font-size="10" font-style="italic" fill="#D13239" text-anchor="middle">calls KMS: GenerateDataKey / Decrypt</text>
  </g>
  <!-- DB subnet AZ1 -->
  <g>
    <rect x="230" y="718" width="400" height="76" fill="#EAF0FF" stroke="#527FFF" stroke-width="1"/>
    <text x="240" y="742" font-size="12" font-weight="bold" fill="#2F5FD0">DB Subnet</text>
    <rect x="280" y="752" width="90" height="32" rx="3" fill="#527FFF"/>
    <text x="325" y="772" font-size="10" fill="#fff" text-anchor="middle">RDS (primary)</text>
    <text x="500" y="772" font-size="11" fill="#232F3E" text-anchor="middle">Amazon RDS — encrypted (SSE-KMS)</text>
  </g>

  <!-- Public subnet AZ2 -->
  <g>
    <rect x="710" y="430" width="400" height="46" fill="#E6F4EA" stroke="#1B7A2E" stroke-width="1"/>
    <text x="720" y="459" font-size="12" font-weight="bold" fill="#1B7A2E">Public subnet</text>
    <text x="1100" y="459" font-size="11" fill="#555" text-anchor="end">NAT Gateway</text>
  </g>
  <!-- Web subnet AZ2 -->
  <g>
    <rect x="710" y="490" width="400" height="100" fill="#FFF4E5" stroke="#FF9900" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="720" y="514" font-size="12" font-weight="bold" fill="#B25E00">Web Subnet</text>
    <rect x="760" y="528" width="60" height="44" rx="3" fill="#FF9900"/>
    <text x="790" y="554" font-size="10" fill="#fff" text-anchor="middle">EC2</text>
    <rect x="840" y="528" width="60" height="44" rx="3" fill="#FF9900"/>
    <text x="870" y="554" font-size="10" fill="#fff" text-anchor="middle">EC2</text>
    <text x="980" y="554" font-size="11" fill="#232F3E" text-anchor="middle">EC2 Instances — Web servers</text>
  </g>
  <!-- App subnet AZ2 -->
  <g>
    <rect x="710" y="604" width="400" height="100" fill="#FFF4E5" stroke="#FF9900" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="720" y="628" font-size="12" font-weight="bold" fill="#B25E00">App Subnet</text>
    <rect x="760" y="642" width="60" height="44" rx="3" fill="#FF9900"/>
    <text x="790" y="668" font-size="10" fill="#fff" text-anchor="middle">EC2</text>
    <rect x="840" y="642" width="60" height="44" rx="3" fill="#FF9900"/>
    <text x="870" y="668" font-size="10" fill="#fff" text-anchor="middle">EC2</text>
    <text x="980" y="668" font-size="11" fill="#232F3E" text-anchor="middle">EC2 Instances — App servers</text>
    <text x="980" y="684" font-size="10" font-style="italic" fill="#D13239" text-anchor="middle">calls KMS: GenerateDataKey / Decrypt</text>
  </g>
  <!-- DB subnet AZ2 -->
  <g>
    <rect x="710" y="718" width="400" height="76" fill="#EAF0FF" stroke="#527FFF" stroke-width="1"/>
    <text x="720" y="742" font-size="12" font-weight="bold" fill="#2F5FD0">DB Subnet</text>
    <rect x="760" y="752" width="90" height="32" rx="3" fill="#527FFF"/>
    <text x="805" y="772" font-size="10" fill="#fff" text-anchor="middle">RDS (standby)</text>
    <text x="980" y="772" font-size="11" fill="#232F3E" text-anchor="middle">Amazon RDS — encrypted (SSE-KMS)</text>
  </g>

  <!-- Flow arrows inside VPC -->
  <g stroke="#232F3E" stroke-width="1.8" fill="none">
    <line x1="555" y1="230" x2="555" y2="348" marker-end="url(#arrow)"/>
    <line x1="600" y1="402" x2="420" y2="488" marker-end="url(#arrow)"/>
    <line x1="600" y1="402" x2="900" y2="488" marker-end="url(#arrow)"/>
    <line x1="420" y1="590" x2="420" y2="602" marker-end="url(#arrow)"/>
    <line x1="900" y1="590" x2="900" y2="602" marker-end="url(#arrow)"/>
    <line x1="420" y1="704" x2="420" y2="716" marker-end="url(#arrow)"/>
    <line x1="900" y1="704" x2="900" y2="716" marker-end="url(#arrow)"/>
  </g>
  <text x="566" y="300" font-size="11" fill="#232F3E">HTTPS</text>

  <!-- KMS key flow arrows (red dashed) -->
  <g stroke="#D13239" stroke-width="1.8" fill="none" stroke-dasharray="6 4">
    <path d="M 980 230 C 980 300, 700 560, 470 640" marker-end="url(#arrowRed)"/>
    <path d="M 960 230 C 960 320, 860 560, 850 640" marker-end="url(#arrowRed)"/>
    <path d="M 900 230 C 900 420, 560 700, 380 750" marker-end="url(#arrowRed)"/>
  </g>
  <text x="990" y="330" font-size="11" font-weight="bold" fill="#D13239">data key</text>
  <text x="990" y="345" font-size="11" fill="#D13239">(GenerateDataKey)</text>

  <!-- S3 + Secrets Manager row (bottom, outside VPC) -->
  <g>
    <rect x="190" y="838" width="0" height="0"/>
  </g>
  <text x="170" y="872" font-size="11" fill="#555">&#9888; Diagram simplified — KMS also encrypts S3 (SSE-KMS), Secrets Manager secrets, EBS volumes &amp; CloudTrail logs.</text>
</svg>
